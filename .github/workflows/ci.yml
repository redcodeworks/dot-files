# SPDX-License-Identifier: MIT
# Branching: main is protected. Push to `testing`; this workflow runs on that push only (one run per push). The required
# checks `test` and `secrets` are matched by name, so the push run's checks on the pull request's head commit satisfy them.
# A pull request can only be merged into main when both jobs below pass.
# Third-party actions and downloads are pinned: actions by commit SHA, binaries by sha256.
name: ci

on:
  push:
    branches: [testing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check "test": dotctl behaviour, .gitignore rules, the leak scanner on fixtures and on this repo and its history.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install just (pinned) and shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -sSfL -o just.tgz https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          echo "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e  just.tgz" | sha256sum -c -
          sudo tar -xzf just.tgz -C /usr/local/bin just
      - name: Test suite
        run: tools/test.sh
      - name: Leak check on the tree and on every commit
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}   # the owner's private personal-strings list (an encrypted repository secret)
        run: |
          if [ -n "$LEAK_PATTERNS" ]; then
              printf '%s\n' "$LEAK_PATTERNS" > "$RUNNER_TEMP/leak-patterns"
              export LEAK_PATTERNS_FILE="$RUNNER_TEMP/leak-patterns"
          else
              echo "note: no LEAK_PATTERNS secret (a run without the secret); generic patterns only"
          fi
          tools/leak-check.sh
          tools/leak-check.sh --history

  # Required check "secrets": gitleaks over the whole history.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-banner --redact -v
