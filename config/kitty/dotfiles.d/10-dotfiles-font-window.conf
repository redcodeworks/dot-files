# Needs the JetBrains Mono Nerd Font installed.
font_family family="JetBrainsMono Nerd Font" style="Medium"
font_size 12.0

hide_window_decorations yes

window_padding_width 10

# Shell: kitty uses your login shell by default. To launch fish explicitly, uncomment and adjust:
# shell /usr/bin/fish

# Deliberately NOT set: background_opacity / background_blur. Alpha blending did not render
# on the author's AMD GPU under niri, whether app-rendered (kitty's own setting) or niri's
# compositor-level `opacity` window rule. Revisit if a newer niri/Mesa fixes this.
