; Example GameMode user config. GameMode reads exactly one file, ~/.config/gamemode.ini, with no drop-in
; directory, so this ships as an EXAMPLE: copy it to ~/.config/gamemode.ini (or merge the lines you want).
[general]
; Higher scheduling priority for the game process while gamemode is active.
; Needs your user in the `gamemode` group (grants nice -10 via /etc/security/limits.d/10-gamemode.conf)
; or this silently does nothing.
renice=10

; Keep the CPU governor at what amd-pstate-epp already uses (`powersave`) so gamemoded does not flip it to
; `performance`: with amd-pstate in active mode that also forces energy_performance_preference to
; `performance`, and GameMode never restores it (upstream FeralInteractive/gamemode#419, reproduced on 1.8.2).
; Only relevant on AMD with amd-pstate-epp. Undo: delete this line (the packaged default is `performance`).
desiredgov=powersave

; [gpu] cannot be set here: gamemode refuses to read that section from any user-writable config file (the
; GPU helper runs as root via polkit), so GPU tuning (gpu_device, amd_performance_level ...) belongs in
; /etc/gamemode.ini.

[custom]
; Stock tuned `latency-performance` (performance governor, which forces EPP to performance on amd-pstate;
; clocks pinned; platform profile performance; deep C-states limited) only while a game runs.
; tuned-adm works unprivileged for the active session (polkit) and takes about 1 s, well under GameMode's
; 10 s script timeout. Order: GameMode sets desiredgov first and runs `start` last, so tuned wins during the
; game; on exit GameMode restores its own settings, then `end` returns to balanced.
; If gamemoded dies mid-game the profile persists: run `tuned-adm profile balanced`.
; Undo: delete this [custom] section.
start=tuned-adm profile latency-performance
end=tuned-adm profile balanced
