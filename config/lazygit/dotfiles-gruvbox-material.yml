# lazygit: Gruvbox Material, dark variant MEDIUM (bg0 #282828). Colours only; no other settings.
# Not read automatically: lazygit loads config.yml. Either merge this into your config.yml, or
# load both files with the LG_CONFIG_FILE environment variable (comma-separated list), e.g.
#   LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/dotfiles-gruvbox-material.yml"
# gui.colorScheme: auto (default) picks gui.darkTheme or gui.lightTheme from the terminal
# background, layered over gui.theme. Only darkTheme is set: on a light terminal lazygit keeps its
# default ANSI colours, because no light tints are verified here.
gui:
  darkTheme:
    activeBorderColor: ['#a9b665', bold]            # green
    inactiveBorderColor: ['#928374']                # grey1
    searchingActiveBorderColor: ['#d8a657', bold]   # yellow
    optionsTextColor: ['#7daea3']                   # blue
    selectedLineFgColor: ['#d4be98', bold]          # fg
    selectedLineBgColor: ['#45403d']                # bg3
    inactiveViewSelectedLineBgColor: ['#32302f']    # bg1
    cherryPickedCommitFgColor: ['#282828']          # bg0 on aqua
    cherryPickedCommitBgColor: ['#89b482']          # aqua
    markedBaseCommitFgColor: ['#282828']            # bg0 on yellow
    markedBaseCommitBgColor: ['#d8a657']            # yellow
    unstagedChangesColor: ['#ea6962']               # red
    defaultFgColor: ['#d4be98']                     # fg
