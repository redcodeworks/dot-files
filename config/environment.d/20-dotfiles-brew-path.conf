# Homebrew's bin, appended *after* the system dirs so brew never shadows a system
# tool (same ordering as the fish brew drop-in). Without this, anything the compositor spawns
# directly -- e.g. `kitty hx` or `kitty fish -C "y ..."` -- can't find brew-installed
# hx/yazi, because the systemd user-session PATH doesn't include brew.
PATH=${PATH}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
