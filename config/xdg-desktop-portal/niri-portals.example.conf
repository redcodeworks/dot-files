# EXAMPLE for a setup that uses the oo7 secret service portal (backend "oo7-portal"). Do not install it
# as-is otherwise: if that backend is absent, Flatpak apps lose secret storage through the portal.
# Copy to ~/.config/xdg-desktop-portal/niri-portals.conf (xdg-desktop-portal reads it when
# XDG_CURRENT_DESKTOP=niri). If you already have one, merge by hand.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
# "gnome" and "gtk" do not implement Secret: it is its own backend. oo7 registers "oo7-portal"
# (see /usr/share/xdg-desktop-portal/portals/oo7-portal.portal once oo7 is installed). With gnome-keyring,
# use gnome-keyring here instead. Check which secret provider your system actually has.
org.freedesktop.impl.portal.Secret=oo7-portal;
